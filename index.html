<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Speech Todo</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f3f5f9;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h1{
margin-bottom:20px;
}

textarea{
width:100%;
height:220px;
padding:15px;
font-size:22px;
border:2px solid #ccc;
border-radius:10px;
resize:none;
outline:none;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:20px;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
color:#fff;
}

.start{
background:#28a745;
}

.stop{
background:#dc3545;
}

.todo{
background:#007bff;
}

.clear{
background:#ff9800;
}

.status{
margin-top:15px;
font-size:18px;
font-weight:bold;
}

h2{
margin-top:30px;
margin-bottom:15px;
}

ul{
list-style:none;
}

li{
background:#eef5ff;
margin-bottom:12px;
padding:15px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.text{
flex:1;
word-break:break-word;
}

.delete{
background:red;
padding:8px 12px;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>🎤 Speech Todo</h1>

<textarea
id="result"
placeholder="Speak or type here..."
></textarea>

<div class="buttons">

<button class="start" onclick="start()">
🎤 Start
</button>

<button class="stop" onclick="stop()">
⏹ Stop
</button>

<button class="todo" onclick="saveTodo()">
✅ Todo
</button>

<button class="clear" onclick="clearCurrent()">
🗑 Clear
</button>

</div>

<div class="status" id="status">
Stopped
</div>

<h2>Todo History</h2>

<ul id="todoList"></ul>

</div>

<script>

const textarea=document.getElementById("result");
const status=document.getElementById("status");
const todoList=document.getElementById("todoList");

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Speech Recognition is not supported.\nUse Google Chrome.");

}

const recognition=SpeechRecognition?new SpeechRecognition():null;

let finalText="";

if(recognition){

recognition.continuous=true;
recognition.interimResults=true;
recognition.lang="en-US";

}

textarea.addEventListener("input",function(){

db.ref("speech").set({

text:textarea.value,
clear:false,
time:Date.now()

});

});

async function start(){

if(!recognition) return;

try{

await navigator.mediaDevices.getUserMedia({

audio:true

});

recognition.start();

}catch(e){

alert("Please allow microphone permission.");

}

}

function stop(){

if(recognition){

recognition.stop();

}

}

if(recognition){

recognition.onstart=function(){

status.innerHTML="🎤 Listening...";
status.style.color="green";

};

recognition.onend=function(){

status.innerHTML="Stopped";
status.style.color="red";

};

recognition.onerror=function(e){

alert("Speech Error : "+e.error);

};

recognition.onresult=function(event){

let interim="";

for(let i=event.resultIndex;i<event.results.length;i++){

const text=event.results[i][0].transcript;

if(event.results[i].isFinal){

finalText+=text+" ";

}else{

interim+=text;

}

}

const liveText=finalText+interim;

textarea.value=liveText;

db.ref("speech").set({

text:liveText,
clear:false,
time:Date.now()

});

};

}

function clearCurrent(){

finalText="";

textarea.value="";

db.ref("speech").set({

text:"",
clear:true,
time:Date.now()

});

}

function saveTodo(){

const text=textarea.value.trim();

if(text==="") return;

const id=Date.now();

db.ref("history/"+id).set({

text:text,
time:id

});

clearCurrent();

}

db.ref("history").on("value",function(snapshot){

todoList.innerHTML="";

snapshot.forEach(function(child){

const data=child.val();
const key=child.key;

const li=document.createElement("li");

const txt=document.createElement("div");
txt.className="text";
txt.innerHTML=data.text;

const del=document.createElement("button");
del.className="delete";
del.innerHTML="Delete";

del.onclick=function(){

db.ref("history/"+key).remove();

};

li.appendChild(txt);
li.appendChild(del);

todoList.prepend(li);

});

});

db.ref("speech").on("value",function(snapshot){

const data=snapshot.val();

if(data && data.clear){

finalText="";
textarea.value="";

}

});

</script>

</body>

</html>
