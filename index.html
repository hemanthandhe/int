<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Speech Todo</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="firebase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f3f5f9;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h1{
margin-bottom:20px;
}

textarea{
width:100%;
height:220px;
padding:15px;
font-size:22px;
border:2px solid #ccc;
border-radius:10px;
resize:none;
outline:none;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:20px;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
color:white;
}

.start{
background:#28a745;
}

.stop{
background:#dc3545;
}

.todo{
background:#007bff;
}

.clear{
background:#ff9800;
}

.status{
margin-top:15px;
font-size:18px;
font-weight:bold;
}

h2{
margin-top:30px;
margin-bottom:15px;
}

ul{
list-style:none;
}

li{
background:#eef5ff;
margin-bottom:12px;
padding:15px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.delete{
background:red;
padding:8px 12px;
}

.text{
flex:1;
word-break:break-word;
}

</style>

</head>

<body>

<div class="container">

<h1>🎤 Speech Todo</h1>

<textarea
id="result"
placeholder="Speak or type here..."
></textarea>

    <h3>Upload Image</h3>

<input
type="file"
id="imageFile"
accept="image/*">

<button onclick="uploadImage()">
📷 Upload Image
</button>

<div class="buttons">

<button class="start" onclick="start()">🎤 Start</button>

<button class="stop" onclick="stop()">⏹ Stop</button>

<button class="todo" onclick="saveTodo()">✅ Todo</button>

<button class="clear" onclick="clearCurrent()">🗑 Clear</button>

</div>

<div class="status" id="status">
Stopped
</div>

<h2>Todo History</h2>

<ul id="todoList"></ul>

</div>

<script>
// ----------------------------
// Firebase References
// ----------------------------
const textarea = document.getElementById("result");
const status = document.getElementById("status");
const todoList = document.getElementById("todoList");

// ----------------------------
// Check Speech Recognition
// ----------------------------
const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (!SpeechRecognition) {
    alert("Your browser does not support Speech Recognition.\n\nUse Google Chrome on Android/Desktop.");
}

// ----------------------------
// Create Recognition
// ----------------------------
const recognition = SpeechRecognition ? new SpeechRecognition() : null;

if (recognition) {

    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "en-US";

}

let finalText = "";

// ----------------------------
// Live typing -> Firebase
// ----------------------------
textarea.addEventListener("input", function () {

    db.ref("speech").set({

        text: textarea.value,
        clear: false,
        time: Date.now()

    });

});

// ----------------------------
// START
// ----------------------------
async function start() {

    if (!recognition) return;

    try {

        await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        recognition.start();

    } catch (err) {

        alert("Please allow microphone permission.");

        console.log(err);

    }

}

// ----------------------------
// STOP
// ----------------------------
function stop() {

    if (recognition) {

        recognition.stop();

    }

}

// ----------------------------
// Recognition Started
// ----------------------------
if (recognition) {

recognition.onstart = function () {

    status.innerHTML = "🎤 Listening...";
    status.style.color = "green";

};

}

// ----------------------------
// Recognition Ended
// ----------------------------
if (recognition) {

recognition.onend = function () {

    status.innerHTML = "Stopped";
    status.style.color = "red";

};

}

// ----------------------------
// Recognition Error
// ----------------------------
if (recognition) {

recognition.onerror = function (e) {

    console.log(e);

    alert("Speech Error : " + e.error);

};

}

// ----------------------------
// Speech Result
// ----------------------------
if (recognition) {

recognition.onresult = function (event) {

    let interim = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {

        let transcript = event.results[i][0].transcript;

        if (event.results[i].isFinal) {

            finalText += transcript + " ";

        } else {

            interim += transcript;

        }

    }

    let liveText = finalText + interim;

    textarea.value = liveText;

    db.ref("speech").set({

        text: liveText,
        clear: false,
        time: Date.now()

    });

};

}

// ----------------------------
// Clear Current
// ----------------------------
function clearCurrent() {

    finalText = "";

    textarea.value = "";

    db.ref("speech").set({

        text: "",
        clear: true,
        time: Date.now()

    });

}

// ----------------------------
// Save Todo
// ----------------------------
function saveTodo() {

    let text = textarea.value.trim();

    if (text === "") return;

    const id = Date.now();

    db.ref("history/" + id).set({

        text: text,
        time: id

    });

    clearCurrent();

}

// ----------------------------
// Load History
// ----------------------------
db.ref("history").on("value", function (snapshot) {

    todoList.innerHTML = "";

    snapshot.forEach(function (child) {

        let data = child.val();

        let key = child.key;

        let li = document.createElement("li");

        let span = document.createElement("div");

        span.className = "text";

        span.innerHTML = data.text;

        let del = document.createElement("button");

        del.innerHTML = "Delete";

        del.className = "delete";

        del.onclick = function () {

            db.ref("history/" + key).remove();

        };

        li.appendChild(span);

        li.appendChild(del);

        todoList.prepend(li);

    });

});

// ----------------------------
// Live Clear
// ----------------------------
db.ref("speech").on("value", function (snapshot) {

    const data = snapshot.val();

    if (!data) return;

    if (data.clear) {

        finalText = "";

        textarea.value = "";

    }

});
</script>

</body>
</html>
