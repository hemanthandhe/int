<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Live View</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase.js"></script>

<style>

body{
    margin:0;
    background:#111;
    font-family:Arial;
}

.topbar{
    padding:20px;
    text-align:center;
}

button{
    padding:15px 35px;
    font-size:20px;
    background:#ff3b30;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#d60000;
}

#live{
    width:90%;
    margin:20px auto;
    min-height:350px;
    background:white;
    color:black;
    padding:40px;
    border-radius:15px;
    font-size:42px;
    line-height:65px;
    white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="topbar">
    <button onclick="clearText()">🗑 Clear</button>
</div>

<div id="live">
Waiting for speech...
</div>

<script>

firebase.database().ref("speech").on("value",function(snapshot){

    let data=snapshot.val();

    if(data && data.text){

        document.getElementById("live").innerHTML=data.text;

    }else{

        document.getElementById("live").innerHTML="";

    }

});

function clearText(){

    firebase.database().ref("speech").set({

        text:"",
        time:Date.now(),
        clear:true

    });

}

</script>

</body>

</html>
