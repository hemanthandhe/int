<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Live View</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="firebase.js"></script>

<style>

body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

#live{
    width:90%;
    min-height:300px;
    background:white;
    color:#000;
    padding:40px;
    border-radius:15px;
    font-size:40px;
    line-height:60px;
    white-space:pre-wrap;
}

</style>

</head>

<body>

<div id="live">Waiting for speech...</div>

<script>

console.log("Firebase Loaded");

firebase.database().ref("speech").on("value", function(snapshot){

    console.log(snapshot.val());

    if(snapshot.exists()){

        document.getElementById("live").innerHTML =
        snapshot.val().text;

    }

});

</script>

</body>
</html>
