<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Speech View</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#111;
padding:30px;
color:white;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
font-size:45px;
margin-bottom:25px;
text-align:center;
}

#liveText{

background:white;
color:black;
padding:30px;

min-height:250px;

border-radius:15px;

font-size:45px;

line-height:1.6;

word-wrap:break-word;

margin-bottom:30px;

}

.buttons{

display:flex;

gap:15px;

justify-content:center;

margin-bottom:30px;

}

button{

padding:15px 35px;

font-size:20px;

border:none;

border-radius:10px;

cursor:pointer;

color:white;

}

.clear{

background:red;

}

.refresh{

background:#2196f3;

}

h2{

margin-bottom:15px;

}

ul{

list-style:none;

}

li{

background:#ffffff;

color:#000;

padding:20px;

border-radius:10px;

margin-bottom:15px;

font-size:24px;

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

}

.delete{

background:red;

padding:10px 15px;

border:none;

color:white;

border-radius:8px;

cursor:pointer;

}

.text{

flex:1;

word-break:break-word;

}

@media(max-width:768px){

#liveText{

font-size:28px;

}

li{

font-size:18px;

}

button{

width:100%;

}

.buttons{

flex-direction:column;

}

}

  .wrapper{

display:grid;

grid-template-columns:2fr 1fr;

gap:20px;

}

#liveText{

background:white;

padding:20px;

font-size:40px;

min-height:300px;

}

.image{

background:white;

padding:20px;

border-radius:10px;

}

</style>

</head>

<body>

<div class="container">

<h1>📺 Live Speech Viewer</h1>

<div id="liveText">
Waiting for speech...
</div>

<div class="buttons">

<button class="clear" onclick="clearSpeech()">
🗑 Clear Screen
</button>

<button class="refresh" onclick="location.reload()">
🔄 Refresh
</button>

</div>

<h2>📝 Todo History</h2>

<ul id="todoList"></ul>

</div>
  <div class="wrapper">

<div class="speech">

<h2>Live Speech</h2>

<div id="liveText"></div>

</div>

<div class="image">

<h2>Live Image</h2>

<img
id="liveImage"
src=""
style="width:100%;border-radius:10px;">

</div>

</div>

<script>

// LIVE SPEECH

db.ref("speech").on("value",function(snapshot){

const data=snapshot.val();

if(data){

document.getElementById("liveText").innerHTML=data.text || "";

}

});

// CLEAR BUTTON

function clearSpeech(){

db.ref("speech").set({

text:"",
clear:true,
time:Date.now()

});

}

// HISTORY

db.ref("history").on("value",function(snapshot){

const list=document.getElementById("todoList");

list.innerHTML="";

snapshot.forEach(function(child){

const data=child.val();

const key=child.key;

const li=document.createElement("li");

const txt=document.createElement("div");

txt.className="text";

txt.innerHTML=data.text;

const del=document.createElement("button");

del.innerHTML="Delete";

del.className="delete";

del.onclick=function(){

db.ref("history/"+key).remove();

};

li.appendChild(txt);

li.appendChild(del);

list.prepend(li);

});

});

  db.ref("image").on("value",(snapshot)=>{

const data=snapshot.val();

if(!data)return;

document.getElementById("liveImage").src=data.url;

});

</script>

</body>
</html>
