<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Speech Viewer</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#111;
color:#fff;
padding:30px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
font-size:42px;
margin-bottom:25px;
}

#liveText{
background:#fff;
color:#000;
padding:30px;
min-height:250px;
border-radius:15px;
font-size:42px;
line-height:1.6;
word-break:break-word;
margin-bottom:25px;
}

.buttons{
display:flex;
justify-content:center;
gap:15px;
margin-bottom:30px;
flex-wrap:wrap;
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
color:#fff;
}

.clear{
background:#e53935;
}

.refresh{
background:#1e88e5;
}

h2{
font-size:30px;
margin-bottom:20px;
}

ul{
list-style:none;
}

li{
background:#fff;
color:#000;
padding:18px;
margin-bottom:15px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.text{
flex:1;
font-size:22px;
word-break:break-word;
}

.delete{
background:#e53935;
padding:10px 18px;
border:none;
border-radius:8px;
color:#fff;
cursor:pointer;
}

@media(max-width:768px){

body{
padding:15px;
}

h1{
font-size:30px;
}

#liveText{
font-size:24px;
padding:20px;
min-height:180px;
}

.buttons{
flex-direction:column;
}

button{
width:100%;
}

h2{
font-size:24px;
}

.text{
font-size:18px;
}

}

</style>

</head>

<body>

<div class="container">

<h1>📺 Live Speech Viewer</h1>

<div id="liveText">
Waiting for speech...
</div>

<div class="buttons">

<button class="clear" onclick="clearSpeech()">
🗑 Clear Screen
</button>

<button class="refresh" onclick="location.reload()">
🔄 Refresh
</button>

</div>

<h2>📝 Todo History</h2>

<ul id="todoList"></ul>

</div>

<script>
const liveText = document.getElementById("liveText");
const todoList = document.getElementById("todoList");

// Live Speech
db.ref("speech").on("value", function(snapshot){

    const data = snapshot.val();

    if(data){

        liveText.innerHTML = data.text || "Waiting for speech...";

    }else{

        liveText.innerHTML = "Waiting for speech...";

    }

});

// Todo History
db.ref("history").on("value", function(snapshot){

    todoList.innerHTML = "";

    snapshot.forEach(function(child){

        const data = child.val();
        const key = child.key;

        const li = document.createElement("li");

        li.innerHTML = `
            <span class="text">${data.text}</span>
            <button class="delete" onclick="deleteTodo('${key}')">Delete</button>
        `;

        todoList.prepend(li);

    });

});

function deleteTodo(key){

    db.ref("history/" + key).remove();

}

function clearSpeech(){

    db.ref("speech").set({
        text:"",
        clear:true,
        time:Date.now()
    });

}</script>

</body>

</html>
